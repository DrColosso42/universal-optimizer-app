[tool.poetry]
name = "universal-optimizer"
version = "0.1.5"
description = "Universal Optimizer Library"
authors = ["Vladimir Filipovic <vladofilipovic@hotmail.com>"]
license = "Apache 2.0"
readme = "README.md"
packages = [{include = "uo"},{include = "app"},]

[tool.poetry.dependencies]
python = "^3.11"
pathlib = "^1.0.1"
numpy = "^2.0"
bitstring = "^4.1.1"
coverage = "^7.4.0"
highspy = "^1.12.0"
linopy = "^0.5.8"
matplotlib = "^3.9"
rdkit = "^2025.9.3"

[tool.poetry.group.docs] 
optional = true

[tool.poetry.group.docs.dependencies]
sphinx = "^7.2.5"
sphinx-copybutton = "^0.5.2"
sphinx-rtd-theme = "^1.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
